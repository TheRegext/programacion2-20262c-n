<svg xmlns="http://www.w3.org/2000/svg" width="820" height="700" viewBox="0 0 820 700" font-family="Helvetica, Arial, sans-serif">

  <rect width="820" height="700" fill="#FBF8F3"/>

  <!-- Title -->
  <text x="410" y="46" text-anchor="middle" font-size="24" font-weight="bold" fill="#3E2C20">La matriz como tabla de contadores</text>
  <text x="410" y="72" text-anchor="middle" font-size="14" fill="#8A7968">El dato que se lee no es el valor de la celda: indica QUÉ celda hay que incrementar</text>

  <!-- ===== STEP BOXES ===== -->

  <!-- Box 1 -->
  <rect x="30" y="105" width="220" height="86" rx="8" fill="#FFFFFF" stroke="#D6C9BA" stroke-width="1.5"/>
  <text x="140" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#8A7968" letter-spacing="1">1. SE LEE UNA VENTA</text>
  <text x="140" y="153" text-anchor="middle" font-size="15" font-family="monospace" fill="#3E2C20">sucursal = 2</text>
  <text x="140" y="175" text-anchor="middle" font-size="15" font-family="monospace" fill="#3E2C20">producto = 3</text>

  <!-- arrow 1 -->
  <path d="M 258 148 L 292 148" stroke="#C4622D" stroke-width="2.5" fill="none" marker-end="url(#head)"/>

  <!-- Box 2 -->
  <rect x="300" y="105" width="220" height="86" rx="8" fill="#FFFFFF" stroke="#D6C9BA" stroke-width="1.5"/>
  <text x="410" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#8A7968" letter-spacing="1">2. SE AJUSTAN LOS ÍNDICES</text>
  <text x="410" y="153" text-anchor="middle" font-size="15" font-family="monospace" fill="#3E2C20">2 - 1 = 1  (fila)</text>
  <text x="410" y="175" text-anchor="middle" font-size="15" font-family="monospace" fill="#3E2C20">3 - 1 = 2  (columna)</text>

  <!-- arrow 2 -->
  <path d="M 528 148 L 562 148" stroke="#C4622D" stroke-width="2.5" fill="none" marker-end="url(#head)"/>

  <!-- Box 3 -->
  <rect x="570" y="105" width="220" height="86" rx="8" fill="#FDF0E6" stroke="#C4622D" stroke-width="2"/>
  <text x="680" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#C4622D" letter-spacing="1">3. SE INCREMENTA</text>
  <text x="680" y="163" text-anchor="middle" font-size="20" font-family="monospace" font-weight="bold" fill="#3E2C20">ventas[1][2]++</text>

  <!-- routed arrow from box 3 down into the grid -->
  <path d="M 680 195 L 680 232 L 470 232 L 470 296" stroke="#C4622D" stroke-width="2.5" fill="none" stroke-dasharray="6 5" marker-end="url(#head)"/>

  <!-- ===== GRID ===== -->

  <text x="60" y="272" font-size="16" font-family="monospace" font-weight="bold" fill="#3E2C20">ventas[3][4]</text>

  <!-- column headers -->
  <text x="230" y="288" text-anchor="middle" font-size="13" font-weight="bold" fill="#8A7968">Producto 1</text>
  <text x="370" y="288" text-anchor="middle" font-size="13" font-weight="bold" fill="#8A7968">Producto 2</text>
  <text x="510" y="288" text-anchor="middle" font-size="13" font-weight="bold" fill="#8A7968">Producto 3</text>
  <text x="650" y="288" text-anchor="middle" font-size="13" font-weight="bold" fill="#8A7968">Producto 4</text>

  <!-- row 0 -->
  <text x="150" y="345" text-anchor="end" font-size="13" font-weight="bold" fill="#8A7968">Sucursal 1</text>
  <rect x="160" y="300" width="140" height="80" fill="#FFFFFF" stroke="#D6C9BA" stroke-width="1.5"/>
  <rect x="300" y="300" width="140" height="80" fill="#FFFFFF" stroke="#D6C9BA" stroke-width="1.5"/>
  <rect x="440" y="300" width="140" height="80" fill="#FFFFFF" stroke="#D6C9BA" stroke-width="1.5"/>
  <rect x="580" y="300" width="140" height="80" fill="#FFFFFF" stroke="#D6C9BA" stroke-width="1.5"/>
  <text x="168" y="316" font-size="11" font-family="monospace" fill="#BCAE9E">[0][0]</text>
  <text x="308" y="316" font-size="11" font-family="monospace" fill="#BCAE9E">[0][1]</text>
  <text x="448" y="316" font-size="11" font-family="monospace" fill="#BCAE9E">[0][2]</text>
  <text x="588" y="316" font-size="11" font-family="monospace" fill="#BCAE9E">[0][3]</text>
  <text x="230" y="357" text-anchor="middle" font-size="26" fill="#3E2C20">5</text>
  <text x="370" y="357" text-anchor="middle" font-size="26" fill="#3E2C20">3</text>
  <text x="510" y="357" text-anchor="middle" font-size="26" fill="#3E2C20">8</text>
  <text x="650" y="357" text-anchor="middle" font-size="26" fill="#3E2C20">2</text>

  <!-- row 1 -->
  <text x="150" y="425" text-anchor="end" font-size="13" font-weight="bold" fill="#3E2C20">Sucursal 2</text>
  <rect x="160" y="380" width="140" height="80" fill="#FFFFFF" stroke="#D6C9BA" stroke-width="1.5"/>
  <rect x="300" y="380" width="140" height="80" fill="#FFFFFF" stroke="#D6C9BA" stroke-width="1.5"/>
  <rect x="440" y="380" width="140" height="80" fill="#FDF0E6" stroke="#C4622D" stroke-width="3"/>
  <rect x="580" y="380" width="140" height="80" fill="#FFFFFF" stroke="#D6C9BA" stroke-width="1.5"/>
  <text x="168" y="396" font-size="11" font-family="monospace" fill="#BCAE9E">[1][0]</text>
  <text x="308" y="396" font-size="11" font-family="monospace" fill="#BCAE9E">[1][1]</text>
  <text x="450" y="396" font-size="11" font-family="monospace" font-weight="bold" fill="#C4622D">[1][2]</text>
  <text x="588" y="396" font-size="11" font-family="monospace" fill="#BCAE9E">[1][3]</text>
  <text x="230" y="437" text-anchor="middle" font-size="26" fill="#3E2C20">4</text>
  <text x="370" y="437" text-anchor="middle" font-size="26" fill="#3E2C20">0</text>
  <text x="502" y="437" text-anchor="middle" font-size="26" font-weight="bold" fill="#C4622D">7</text>
  <text x="545" y="437" text-anchor="middle" font-size="14" font-family="monospace" fill="#C4622D">+1</text>
  <text x="650" y="437" text-anchor="middle" font-size="26" fill="#3E2C20">6</text>

  <!-- row 2 -->
  <text x="150" y="505" text-anchor="end" font-size="13" font-weight="bold" fill="#8A7968">Sucursal 3</text>
  <rect x="160" y="460" width="140" height="80" fill="#FFFFFF" stroke="#D6C9BA" stroke-width="1.5"/>
  <rect x="300" y="460" width="140" height="80" fill="#FFFFFF" stroke="#D6C9BA" stroke-width="1.5"/>
  <rect x="440" y="460" width="140" height="80" fill="#FFFFFF" stroke="#D6C9BA" stroke-width="1.5"/>
  <rect x="580" y="460" width="140" height="80" fill="#FFFFFF" stroke="#D6C9BA" stroke-width="1.5"/>
  <text x="168" y="476" font-size="11" font-family="monospace" fill="#BCAE9E">[2][0]</text>
  <text x="308" y="476" font-size="11" font-family="monospace" fill="#BCAE9E">[2][1]</text>
  <text x="448" y="476" font-size="11" font-family="monospace" fill="#BCAE9E">[2][2]</text>
  <text x="588" y="476" font-size="11" font-family="monospace" fill="#BCAE9E">[2][3]</text>
  <text x="230" y="517" text-anchor="middle" font-size="26" fill="#3E2C20">1</text>
  <text x="370" y="517" text-anchor="middle" font-size="26" fill="#3E2C20">9</text>
  <text x="510" y="517" text-anchor="middle" font-size="26" fill="#3E2C20">3</text>
  <text x="650" y="517" text-anchor="middle" font-size="26" fill="#3E2C20">5</text>

  <!-- ===== NOTES ===== -->
  <line x1="60" y1="578" x2="760" y2="578" stroke="#E4DACE" stroke-width="1.5"/>

  <circle cx="70" cy="606" r="4" fill="#C4622D"/>
  <text x="86" y="611" font-size="14" fill="#5C4838">Cada celda guarda <tspan font-weight="bold">cuántas veces ocurrió</tspan> esa combinación, no una nota ni un precio.</text>

  <circle cx="70" cy="636" r="4" fill="#C4622D"/>
  <text x="86" y="641" font-size="14" fill="#5C4838">Toda la matriz arranca en <tspan font-family="monospace" font-weight="bold">0</tspan>: si no se inicializa, los contadores acumulan basura.</text>

  <circle cx="70" cy="666" r="4" fill="#C4622D"/>
  <text x="86" y="671" font-size="14" fill="#5C4838">El usuario cuenta desde <tspan font-weight="bold">1</tspan>; el arreglo indexa desde <tspan font-weight="bold">0</tspan>. De ahí el <tspan font-family="monospace" font-weight="bold">-1</tspan>.</text>

  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C4622D"/>
    </marker>
  </defs>

</svg>
